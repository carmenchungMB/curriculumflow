<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CurriculumFlow — Meaningful Beginnings</title>
<style>
:root {
  --slate-900:#0F172A;--slate-800:#1E293B;--slate-700:#334155;
  --slate-500:#64748B;--slate-300:#CBD5E1;--slate-200:#E2E8F0;
  --slate-100:#F1F5F9;--slate-50:#F8FAFC;--paper:#F8F7F4;
  --sage:#4CAF85;--sage-light:#D1FAE5;--sage-dark:#059669;
  --amber:#F59E0B;--amber-light:#FEF3C7;--amber-dark:#D97706;
  --violet:#8B5CF6;--violet-light:#EDE9FE;--violet-dark:#7C3AED;
  --rose:#F43F5E;--rose-light:#FFE4E6;
  --sky:#0EA5E9;--sky-light:#E0F2FE;--white:#FFFFFF;
}
*{margin:0;padding:0;box-sizing:border-box;}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',system-ui,sans-serif;background:var(--paper);color:var(--slate-800);height:100vh;display:flex;flex-direction:column;overflow:hidden;}

/* TOP BAR */
.topbar{background:var(--slate-800);color:white;padding:0 16px;height:52px;display:flex;align-items:center;justify-content:space-between;flex-shrink:0;z-index:100;gap:12px;}
.topbar-brand{display:flex;align-items:center;gap:8px;font-weight:700;font-size:14px;letter-spacing:.02em;white-space:nowrap;}
.brand-dot{width:8px;height:8px;border-radius:50%;background:var(--sage);}
.topbar-cycle{display:flex;align-items:center;gap:0;background:rgba(255,255,255,.06);border-radius:7px;padding:3px 5px;font-size:11px;}
.cycle-step{padding:3px 8px;border-radius:4px;color:var(--slate-300);display:flex;align-items:center;gap:4px;white-space:nowrap;}
.cycle-step.sage{background:rgba(76,175,133,.2);color:#6EDBA8;}
.cycle-step.amber{background:rgba(245,158,11,.2);color:#FCD34D;}
.cycle-step.violet{background:rgba(139,92,246,.2);color:#C4B5FD;}
.cycle-arrow{color:var(--slate-500);padding:0 2px;font-size:11px;}
.step-date{font-weight:700;}
.topbar-classroom{display:flex;align-items:center;gap:8px;white-space:nowrap;}
.classroom-badge{background:rgba(255,255,255,.1);border-radius:6px;padding:4px 10px;font-size:12px;font-weight:600;color:white;border:1px solid rgba(255,255,255,.15);}
.site-dot{width:8px;height:8px;border-radius:50%;display:inline-block;margin-right:4px;}

/* LAYOUT */
.app-body{display:flex;flex:1;overflow:hidden;}

/* SIDEBAR */
.sidebar{width:210px;background:var(--white);border-right:1px solid var(--slate-200);display:flex;flex-direction:column;flex-shrink:0;overflow-y:auto;}
.sidebar-section{padding:14px 10px 6px;}
.sidebar-label{font-size:10px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--slate-500);padding:0 8px 6px;}
.nav-item{display:flex;align-items:center;gap:8px;padding:7px 10px;border-radius:7px;cursor:pointer;font-size:13px;font-weight:500;color:var(--slate-700);transition:background .15s,color .15s;margin-bottom:1px;}
.nav-item:hover{background:var(--slate-100);}
.nav-item.active{background:var(--sage-light);color:var(--sage-dark);}
.nav-item.active-violet{background:var(--violet-light);color:var(--violet-dark);}
.nav-icon{font-size:15px;width:18px;text-align:center;}
.nav-badge{margin-left:auto;background:var(--rose);color:white;font-size:10px;font-weight:700;padding:1px 5px;border-radius:99px;}
.sidebar-divider{border:none;border-top:1px solid var(--slate-100);margin:6px 10px;}

/* CLASSROOM LIST in sidebar */
.classroom-item{display:flex;align-items:center;gap:8px;padding:7px 10px;border-radius:7px;cursor:pointer;font-size:12.5px;font-weight:500;color:var(--slate-700);transition:background .15s;margin-bottom:1px;}
.classroom-item:hover{background:var(--slate-100);}
.classroom-item.active-room{background:var(--sage-light);color:var(--sage-dark);font-weight:700;}
.room-dot{width:9px;height:9px;border-radius:50%;flex-shrink:0;}
.room-name{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.room-age{font-size:10px;color:var(--slate-500);white-space:nowrap;}
.site-header-row{display:flex;align-items:center;gap:6px;padding:8px 10px 4px;font-size:10px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--slate-500);}
.site-color-bar{width:3px;height:12px;border-radius:2px;}

/* MAIN */
.main{flex:1;overflow-y:auto;padding:20px 24px;}

/* PAGE HEADER */
.page-header{display:flex;align-items:flex-start;justify-content:space-between;margin-bottom:20px;}
.page-title{font-size:20px;font-weight:700;color:var(--slate-900);}
.page-subtitle{font-size:12px;color:var(--slate-500);margin-top:2px;}

/* BUTTONS */
.btn{padding:7px 14px;border-radius:7px;border:none;cursor:pointer;font-size:12.5px;font-weight:600;display:inline-flex;align-items:center;gap:5px;transition:all .15s;}
.btn-primary{background:var(--sage);color:white;}.btn-primary:hover{background:var(--sage-dark);}
.btn-violet{background:var(--violet);color:white;}.btn-violet:hover{background:var(--violet-dark);}
.btn-amber{background:var(--amber);color:white;}.btn-amber:hover{background:var(--amber-dark);}
.btn-outline{background:white;color:var(--slate-700);border:1.5px solid var(--slate-300);}.btn-outline:hover{background:var(--slate-100);}
.btn-sm{padding:5px 10px;font-size:11.5px;}
.btn-ghost{background:none;border:none;cursor:pointer;color:var(--slate-500);font-size:12px;padding:4px 8px;border-radius:5px;font-family:inherit;}.btn-ghost:hover{background:var(--slate-100);}

/* ALERTS */
.alert{display:flex;align-items:center;gap:12px;padding:11px 15px;border-radius:9px;margin-bottom:18px;font-size:12.5px;}
.alert-amber{background:var(--amber-light);border:1px solid #FDE68A;color:#92400E;}
.alert-sage{background:var(--sage-light);border:1px solid #A7F3D0;color:#065F46;}
.alert-violet{background:var(--violet-light);border:1px solid #DDD6FE;color:#4C1D95;}
.alert-icon{font-size:17px;}.alert-text{flex:1;}
.alert-title{font-weight:700;margin-bottom:1px;}

/* CALENDAR */
.cal-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:5px;}
.cal-day-header{text-align:center;font-size:10px;font-weight:700;color:var(--slate-500);letter-spacing:.05em;text-transform:uppercase;padding-bottom:5px;}
.cal-cell{min-height:82px;background:white;border-radius:7px;padding:7px;border:1.5px solid transparent;transition:border-color .15s;cursor:default;}
.cal-cell:hover{border-color:var(--slate-300);}
.cal-cell.other-month{background:var(--slate-100);opacity:.5;}
.cal-cell.today{border-color:var(--sage)!important;}
.cal-cell.deadline-sel{border-color:var(--amber)!important;background:#FFFBF0;}
.cal-cell.deadline-tracker{border-color:var(--violet)!important;background:#FAFAFE;}
.cal-cell.procurement-day{border-color:var(--sky)!important;background:var(--sky-light);}
.cal-num{font-size:12px;font-weight:600;color:var(--slate-700);margin-bottom:3px;}
.cal-cell.today .cal-num{background:var(--sage);color:white;width:22px;height:22px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:11px;}
.cal-tag{font-size:10px;font-weight:600;padding:2px 5px;border-radius:3px;margin-bottom:2px;display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.tag-amber{background:var(--amber-light);color:#92400E;}
.tag-violet{background:var(--violet-light);color:#5B21B6;}
.tag-sky{background:var(--sky-light);color:#0369A1;}
.tag-sage{background:var(--sage-light);color:#065F46;}

/* WEEK ROWS */
.week-rows{display:flex;flex-direction:column;gap:7px;margin-top:14px;}
.week-row{background:white;border-radius:8px;border:1.5px solid var(--slate-100);padding:10px 14px;display:flex;align-items:center;gap:10px;}
.week-label{font-size:11.5px;font-weight:700;color:var(--slate-500);min-width:90px;}
.theme-pill{display:flex;align-items:center;gap:5px;background:var(--sage-light);border-radius:5px;padding:4px 9px;font-size:12px;font-weight:600;color:var(--sage-dark);cursor:pointer;border:1.5px solid transparent;transition:all .15s;}
.theme-pill:hover{border-color:var(--sage);}
.theme-pill.empty{background:var(--slate-100);color:var(--slate-500);border:1.5px dashed var(--slate-300);}
.theme-pill.empty:hover{border-color:var(--sage);background:var(--sage-light);color:var(--sage-dark);}

/* LIBRARY */
.library-filters{display:flex;gap:7px;flex-wrap:wrap;margin-bottom:18px;}
.filter-chip{padding:5px 12px;border-radius:99px;font-size:11.5px;font-weight:600;cursor:pointer;border:1.5px solid var(--slate-200);background:white;color:var(--slate-600);transition:all .15s;}
.filter-chip:hover,.filter-chip.active{background:var(--slate-800);color:white;border-color:var(--slate-800);}
.library-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:12px;}
.theme-card{background:white;border-radius:10px;padding:14px;border:1.5px solid var(--slate-100);cursor:pointer;transition:all .15s;position:relative;overflow:hidden;}
.theme-card:hover{border-color:var(--sage);transform:translateY(-1px);box-shadow:0 4px 14px rgba(76,175,133,.1);}
.theme-card.selected{border-color:var(--sage);background:linear-gradient(135deg,#F0FDF8 0%,white 60%);}
.theme-card-accent{width:4px;height:100%;position:absolute;left:0;top:0;border-radius:10px 0 0 10px;}
.theme-emoji{font-size:24px;margin-bottom:6px;}
.theme-name{font-size:13px;font-weight:700;color:var(--slate-800);margin-bottom:3px;}
.theme-desc{font-size:11.5px;color:var(--slate-500);line-height:1.4;margin-bottom:8px;}
.theme-select-btn{margin-top:8px;width:100%;padding:5px;border-radius:5px;border:1.5px solid var(--slate-200);background:white;cursor:pointer;font-size:11.5px;font-weight:600;color:var(--slate-600);transition:all .15s;font-family:inherit;}
.theme-select-btn:hover{background:var(--sage-light);border-color:var(--sage);color:var(--sage-dark);}
.theme-select-btn.selected{background:var(--sage);border-color:var(--sage);color:white;}

/* ACTIVITY TRACKER */
.week-tracker-card{background:white;border-radius:10px;border:1.5px solid var(--slate-100);margin-bottom:12px;overflow:hidden;}
.week-tracker-card.pending{border-left:4px solid var(--amber);}
.week-tracker-card.ready{border-left:4px solid var(--sage);}
.week-tracker-card.ordered{border-left:4px solid var(--sky);}
.week-tracker-header{display:flex;align-items:center;justify-content:space-between;padding:12px 16px;cursor:pointer;user-select:none;border-bottom:1px solid var(--slate-100);}
.week-tracker-header:hover{background:var(--slate-50);}
.week-tracker-title{font-size:13px;font-weight:700;color:var(--slate-800);}
.week-tracker-theme{font-size:12px;color:var(--sage-dark);font-weight:600;margin-top:2px;}
.week-tracker-meta{display:flex;align-items:center;gap:8px;}
.tracker-status-pill{font-size:11px;font-weight:700;padding:3px 9px;border-radius:99px;}
.pill-pending{background:var(--amber-light);color:#92400E;}
.pill-ready{background:var(--sage-light);color:#065F46;}
.pill-ordered{background:var(--sky-light);color:#0369A1;}
.tracker-chevron{font-size:14px;color:var(--slate-500);transition:transform .2s;}
.tracker-chevron.open{transform:rotate(180deg);}
.week-tracker-body{padding:14px 16px;display:none;}
.week-tracker-body.open{display:block;}
.activity-block{margin-bottom:16px;}
.activity-block:last-child{margin-bottom:0;}
.activity-label{font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.06em;color:var(--slate-500);margin-bottom:7px;display:flex;align-items:center;gap:5px;}
.supply-item{display:grid;grid-template-columns:20px 1fr 90px 70px;gap:7px;align-items:center;padding:4px 0;border-bottom:1px solid var(--slate-100);}
.supply-item:last-child{border-bottom:none;}
.supply-checkbox{width:15px;height:15px;border:1.5px solid var(--slate-300);border-radius:3px;cursor:pointer;appearance:none;-webkit-appearance:none;background:white;flex-shrink:0;transition:all .15s;position:relative;}
.supply-checkbox:checked{background:var(--sage);border-color:var(--sage);}
.supply-checkbox:checked::after{content:'';position:absolute;top:2px;left:4px;width:5px;height:8px;border:2px solid white;border-top:none;border-left:none;transform:rotate(45deg);}
.supply-name{font-size:12.5px;color:var(--slate-700);line-height:1.3;}
.supply-name.unchecked{color:var(--slate-400);text-decoration:line-through;}
.supply-qty-input{border:1.5px solid var(--slate-200);border-radius:5px;padding:4px 7px;font-size:11.5px;color:var(--slate-800);width:100%;font-family:inherit;outline:none;text-align:center;}
.supply-qty-input:focus{border-color:var(--violet);}
.supply-unit{font-size:10.5px;color:var(--slate-500);}
.custom-item-row{display:grid;grid-template-columns:20px 1fr 90px 70px 26px;gap:7px;align-items:center;padding:4px 0;}
.add-custom-btn{display:flex;align-items:center;gap:4px;font-size:11.5px;color:var(--sage-dark);background:none;border:1.5px dashed var(--sage);border-radius:5px;padding:4px 10px;cursor:pointer;margin-top:6px;font-family:inherit;font-weight:600;transition:all .15s;}
.add-custom-btn:hover{background:var(--sage-light);}
.remove-item-btn{background:none;border:none;color:var(--slate-400);cursor:pointer;font-size:14px;padding:0 2px;line-height:1;transition:color .15s;}
.remove-item-btn:hover{color:var(--rose);}
.tracker-footer{margin-top:14px;padding-top:10px;border-top:1px solid var(--slate-100);display:flex;align-items:center;justify-content:space-between;}
.checked-count{font-size:11.5px;color:var(--slate-500);}

/* PROCUREMENT */
.procurement-card{background:white;border-radius:10px;border:1.5px solid var(--slate-100);overflow:hidden;margin-bottom:14px;}
.procurement-card-header{background:var(--violet-light);padding:11px 16px;display:flex;align-items:center;justify-content:space-between;}
.procurement-card-title{font-weight:700;font-size:14px;color:var(--violet-dark);}
.procurement-table{width:100%;border-collapse:collapse;}
.procurement-table th{padding:9px 16px;text-align:left;font-size:10.5px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--slate-500);border-bottom:1px solid var(--slate-100);}
.procurement-table td{padding:9px 16px;font-size:12.5px;border-bottom:1px solid var(--slate-50);vertical-align:top;}
.procurement-table tr:last-child td{border-bottom:none;}
.status-badge{display:inline-flex;align-items:center;gap:3px;font-size:10.5px;font-weight:700;padding:3px 8px;border-radius:99px;}
.badge-pending{background:var(--amber-light);color:#92400E;}
.badge-ready{background:var(--sage-light);color:#065F46;}
.badge-ordered{background:var(--sky-light);color:#0369A1;}

/* SITE FILTER TABS */
.site-tabs{display:flex;gap:6px;margin-bottom:18px;}
.site-tab{padding:6px 14px;border-radius:7px;border:1.5px solid var(--slate-200);background:white;font-size:12px;font-weight:600;cursor:pointer;color:var(--slate-600);transition:all .15s;display:flex;align-items:center;gap:6px;}
.site-tab:hover{border-color:var(--slate-400);}
.site-tab.active{background:var(--slate-800);color:white;border-color:var(--slate-800);}

/* STATS */
.stats-row{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-bottom:20px;}
.stat-card{background:white;border-radius:9px;padding:12px 14px;border:1.5px solid var(--slate-100);}
.stat-label{font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.07em;color:var(--slate-500);margin-bottom:3px;}
.stat-value{font-size:22px;font-weight:800;color:var(--slate-900);}
.stat-value.sage{color:var(--sage-dark);}
.stat-value.amber{color:var(--amber-dark);}
.stat-value.violet{color:var(--violet);}
.stat-sub{font-size:10.5px;color:var(--slate-500);margin-top:1px;}
.section-title{font-size:14px;font-weight:700;color:var(--slate-800);margin-bottom:10px;}

/* MODAL */
.modal-overlay{display:none;position:fixed;inset:0;background:rgba(15,23,42,.5);z-index:500;align-items:center;justify-content:center;}
.modal-overlay.open{display:flex;}
.modal{background:white;border-radius:13px;width:520px;max-width:95vw;max-height:85vh;overflow-y:auto;box-shadow:0 24px 64px rgba(0,0,0,.2);}
.modal-header{padding:18px 22px 14px;border-bottom:1px solid var(--slate-100);display:flex;justify-content:space-between;align-items:flex-start;}
.modal-title{font-size:17px;font-weight:700;}
.modal-close{background:none;border:none;cursor:pointer;font-size:19px;color:var(--slate-500);}
.modal-body{padding:18px 22px;}
.modal-footer{padding:14px 22px;border-top:1px solid var(--slate-100);display:flex;justify-content:flex-end;gap:7px;}
.form-group{margin-bottom:14px;}
.form-label{display:block;font-size:11.5px;font-weight:700;color:var(--slate-700);margin-bottom:5px;letter-spacing:.03em;}
.form-input{width:100%;border:1.5px solid var(--slate-200);border-radius:6px;padding:7px 11px;font-size:12.5px;color:var(--slate-800);outline:none;font-family:inherit;transition:border-color .15s;}
.form-input:focus{border-color:var(--sage);}

/* SYNC STATUS */
.sync-pill{display:flex;align-items:center;gap:5px;font-size:11px;padding:3px 10px;border-radius:99px;font-weight:600;transition:all .3s;}
.sync-pill.idle{background:rgba(255,255,255,.08);color:var(--slate-400);}
.sync-pill.saving{background:rgba(245,158,11,.2);color:#FCD34D;}
.sync-pill.saved{background:rgba(76,175,133,.2);color:#6EDBA8;}
.sync-pill.error{background:rgba(244,63,94,.2);color:#FDA4AF;}
.sync-pill.loading{background:rgba(14,165,233,.2);color:#7DD3FC;}
.sync-dot{width:6px;height:6px;border-radius:50%;background:currentColor;}
/* SETUP SCREEN */
.setup-screen{position:fixed;inset:0;background:var(--paper);z-index:999;display:flex;align-items:center;justify-content:center;}
.setup-card{background:white;border-radius:16px;border:1.5px solid var(--slate-200);padding:36px 40px;width:520px;max-width:95vw;box-shadow:0 8px 40px rgba(0,0,0,.08);}
.setup-title{font-size:20px;font-weight:700;color:var(--slate-900);margin-bottom:6px;}
.setup-subtitle{font-size:13px;color:var(--slate-500);margin-bottom:24px;line-height:1.5;}
.setup-steps{counter-reset:step;margin-bottom:24px;}
.setup-step{display:flex;gap:12px;margin-bottom:14px;font-size:13px;color:var(--slate-700);line-height:1.5;}
.step-num{width:22px;height:22px;border-radius:50%;background:var(--sage);color:white;font-size:11px;font-weight:700;display:flex;align-items:center;justify-content:center;flex-shrink:0;margin-top:1px;}
.setup-note{font-size:11.5px;color:var(--slate-500);background:var(--slate-100);border-radius:7px;padding:10px 14px;margin-bottom:20px;line-height:1.6;}

</head>
<body>

<!-- TOP BAR -->
<div class="topbar">
  <div class="topbar-brand"><div class="brand-dot"></div>CurriculumFlow</div>
  <div class="topbar-cycle">
    <div class="cycle-step sage">📅 <span class="step-date">2nd Mon</span>&nbsp;Select Themes</div>
    <div class="cycle-arrow">›</div>
    <div class="cycle-step amber">📋 <span class="step-date">3rd Mon</span>&nbsp;Update Tracker</div>
    <div class="cycle-arrow">›</div>
    <div class="cycle-step violet">🛒 <span class="step-date">3rd Tue</span>&nbsp;Procurement Buys</div>
  </div>
  <div style="display:flex;align-items:center;gap:10px;">
    <div class="sync-pill idle" id="sync-pill"><div class="sync-dot"></div><span id="sync-label">Not connected</span></div>
    <div class="topbar-classroom">
      <span style="font-size:11px;color:var(--slate-400);">Viewing:</span>
      <span class="classroom-badge" id="topbar-classroom-badge">—</span>
    </div>
    <button onclick="openSetup()" style="background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.15);border-radius:6px;color:white;font-size:11px;padding:4px 9px;cursor:pointer;font-family:inherit;">⚙ Setup</button>
  </div>
</div>

<div class="app-body">

<!-- SIDEBAR -->
<div class="sidebar">
  <div class="sidebar-section">
    <div class="sidebar-label">Planning</div>
    <div class="nav-item active" id="nav-calendar" onclick="showPage('calendar',this)"><span class="nav-icon">📅</span> Calendar</div>
    <div class="nav-item" id="nav-library" onclick="showPage('library',this)"><span class="nav-icon">📚</span> Theme Library</div>
  </div>
  <hr class="sidebar-divider">
  <div class="sidebar-section">
    <div class="sidebar-label">Operations</div>
    <div class="nav-item" id="nav-tracker" onclick="showPage('tracker',this)"><span class="nav-icon">📋</span> Supply Tracker<span class="nav-badge" id="tracker-badge" style="display:none">0</span></div>
    <div class="nav-item" id="nav-procurement" onclick="showPage('procurement',this)"><span class="nav-icon">🛒</span> Procurement</div>
  </div>

// ═══════════════════════════════════════
//  STATE — keyed by classroomId + month
//  monthSchedule[cid][monthKey] = {0:themeId, ...}
//  trackerData[cid][monthKey]   = [{week,themeId,activities,status}, ...]
// ═══════════════════════════════════════
let monthSchedule = {};
let trackerData   = {};

function getCS(cid){ if(!monthSchedule[cid]) monthSchedule[cid]={}; return monthSchedule[cid]; }
function getTD(cid){ if(!trackerData[cid])   trackerData[cid]={};   return trackerData[cid]; }

let viewYear  = 2026;
let viewMonth = 5; // June (0-indexed)

function getMonthKey(y,m){ return `${y}-${m}`; }
function nextMonthYear(y,m){ return m===11?{y:y+1,m:0}:{y,m:m+1}; }

function getNthMonday(year,month,n){
  let count=0;
  for(let d=1;d<=31;d++){
    const dt=new Date(year,month,d);
    if(dt.getMonth()!==month) break;
    if(dt.getDay()===1){ count++; if(count===n) return dt; }
  }
}
function getSelectionMonday(y,m)  { return getNthMonday(y,m,2); }
function getTrackerMonday(y,m)    { return getNthMonday(y,m,3); }
function getProcurementTuesday(y,m){
  const mon=getTrackerMonday(y,m);
  return mon?new Date(mon.getFullYear(),mon.getMonth(),mon.getDate()+1):null;
}
function formatDate(d){ return d.toLocaleDateString('en-US',{month:'short',day:'numeric',year:'numeric'}); }
function isToday(y,m,d){ const t=new Date(); return t.getFullYear()===y&&t.getMonth()===m&&t.getDate()===d; }

function getWeeksInMonth(year,month){
  const weeks=[], lastDay=new Date(year,month+1,0);
  let d=new Date(year,month,1);
  while(d.getDay()!==1) d.setDate(d.getDate()+1);
  let wn=1;
  while(d<=lastDay){
    const end=new Date(d); end.setDate(end.getDate()+6);
    weeks.push({weekNum:wn,start:new Date(d),end:end>lastDay?new Date(lastDay):end,label:`Week ${wn} (${d.toLocaleDateString('en-US',{month:'short',day:'numeric'})})`});
    d.setDate(d.getDate()+7); wn++;
  }
  return weeks;
}

function renderClassroomList(){
  const container=document.getElementById('classroom-list');
  let html='';
  SITES.forEach(site=>{
    const rooms=classrooms.filter(c=>c.siteId===site.id);
    html+=`<div class="site-header-row"><div class="site-color-bar" style="background:${site.color}"></div>${site.name}</div>`;
    rooms.forEach(room=>{
      const active=room.id===currentClassroomId?'active-room':'';
      html+=`<div class="classroom-item ${active}" onclick="switchClassroom('${room.id}')">
        <div class="room-dot" style="background:${site.color}"></div>
        <div class="room-name">${room.emoji} ${room.name}</div>
      </div>`;
    });
  });
  container.innerHTML=html;
}

function switchClassroom(id){
  currentClassroomId=id;
  renderClassroomList();
  updateTopbarClassroom();
  const active=document.querySelector('.page.active');
  if(active?.id==='page-calendar') renderCalendar();
  else if(active?.id==='page-tracker') renderTracker();
  else if(active?.id==='page-procurement') renderProcurement();
  else if(active?.id==='page-library') renderLibrary();
}

function updateTopbarClassroom(){
  const room=getClassroom(currentClassroomId);
  const site=room?getSite(room.siteId):null;
  const badge=document.getElementById('topbar-classroom-badge');
  if(room&&site){
    badge.innerHTML=`<span class="site-dot" style="background:${site.color}"></span>${room.emoji} ${room.name} · ${site.name}`;
  }
}

// ═══════════════════════════════════════
//  CALENDAR
// ═══════════════════════════════════════
function renderCalendar(){
  const y=viewYear,m=viewMonth;
  const room=getClassroom(currentClassroomId);
  const site=room?getSite(room.siteId):null;
  const cs=getCS(currentClassroomId);
  const key=getMonthKey(y,m);
  const schedule=cs[key]||{};

  document.getElementById('cal-title').textContent=new Date(y,m,1).toLocaleDateString('en-US',{month:'long',year:'numeric'});
  document.getElementById('cal-classroom-name').textContent=room?`${room.emoji} ${room.name}`:'';

  const selMon=getSelectionMonday(y,m);
  const trkMon=getTrackerMonday(y,m);
  const procTue=getProcurementTuesday(y,m);
  const today=new Date();
  const alerts=[];

  if(today.getFullYear()===y&&today.getMonth()===m){
    if(selMon){ const d=Math.round((selMon-today)/86400000); if(d>=0&&d<=5) alerts.push(`<div class="alert alert-amber"><span class="alert-icon">⚠️</span><div class="alert-text"><div class="alert-title">Theme selection due ${d===0?'today':`in ${d} days`} — ${formatDate(selMon)}</div>Select 4–5 themes for next month for ${room?.name||'this classroom'}.</div><button class="btn btn-amber btn-sm" onclick="showPage('library',document.getElementById('nav-library'))">Open Library →</button></div>`); }
    if(trkMon){ const d=Math.round((trkMon-today)/86400000); if(d>=0&&d<=5) alerts.push(`<div class="alert alert-violet"><span class="alert-icon">📋</span><div class="alert-text"><div class="alert-title">Tracker update due ${d===0?'today':`in ${d} days`} — ${formatDate(trkMon)}</div>Confirm supplies for next month's themes.</div><button class="btn btn-violet btn-sm" onclick="showPage('tracker',document.getElementById('nav-tracker'))">Open Tracker →</button></div>`); }
  }
  document.getElementById('calendar-alert').innerHTML=alerts.join('');

  const grid=document.getElementById('cal-grid');
  while(grid.children.length>7) grid.removeChild(grid.lastChild);

  const firstOfMonth=new Date(y,m,1);
  const startOffset=firstOfMonth.getDay();
  const daysInMonth=new Date(y,m+1,0).getDate();
  const daysInPrev=new Date(y,m,0).getDate();
  const weeks=getWeeksInMonth(y,m);
  const dayWeekMap={};
  weeks.forEach((w,wi)=>{ for(let d=new Date(w.start);d<=w.end;d.setDate(d.getDate()+1)){ if(d.getMonth()===m) dayWeekMap[d.getDate()]=wi; } });

  for(let i=0;i<startOffset;i++){
    const c=document.createElement('div'); c.className='cal-cell other-month';
    c.innerHTML=`<div class="cal-num">${daysInPrev-startOffset+i+1}</div>`; grid.appendChild(c);
  }
  for(let day=1;day<=daysInMonth;day++){
    const c=document.createElement('div');
    const isSel=selMon&&day===selMon.getDate();
    const isTrk=trkMon&&day===trkMon.getDate();
    const isPro=procTue&&day===procTue.getDate();
    const isTod=isToday(y,m,day);
    const themeId=schedule[dayWeekMap[day]];
    const theme=themeId?getTheme(themeId):null;
    let cls='cal-cell';
    if(isTod) cls+=' today';
    else if(isSel) cls+=' deadline-sel';
    else if(isTrk) cls+=' deadline-tracker';
    else if(isPro) cls+=' procurement-day';
    c.className=cls;
    let tags='';
    if(isSel) tags+=`<div class="cal-tag tag-amber">📅 Select Themes</div>`;
    if(isTrk) tags+=`<div class="cal-tag tag-violet">📋 Update Tracker</div>`;
    if(isPro) tags+=`<div class="cal-tag tag-sky">🛒 Procurement Day</div>`;
    if(theme&&!isSel&&!isTrk&&!isPro) tags+=`<div class="cal-tag tag-sage">${theme.emoji} ${theme.name}</div>`;
    c.innerHTML=`<div class="cal-num">${day}</div>${tags}`;
    if(isSel){ c.style.cursor='pointer'; c.title='Click to schedule themes'; c.onclick=()=>openThemeScheduleModal(y,m); }
    grid.appendChild(c);
  }
  const rem=(startOffset+daysInMonth)%7; const fill=rem===0?0:7-rem;
  for(let i=1;i<=fill;i++){ const c=document.createElement('div'); c.className='cal-cell other-month'; c.innerHTML=`<div class="cal-num">${i}</div>`; grid.appendChild(c); }

  renderWeekRows(y,m);
}

function renderWeekRows(y,m){
  const cs=getCS(currentClassroomId);
  const schedule=cs[getMonthKey(y,m)]||{};
  const weeks=getWeeksInMonth(y,m);
  const room=getClassroom(currentClassroomId);
  const container=document.getElementById('week-rows');
  container.innerHTML='';
  weeks.forEach((w,wi)=>{
    const themeId=schedule[wi]; const theme=themeId?getTheme(themeId):null;
    const row=document.createElement('div'); row.className='week-row';
    row.innerHTML=`<div class="week-label">${w.label}</div>
      <div class="theme-pill ${theme?'':'empty'}" onclick="openThemeScheduleModal(${y},${m})">${theme?`${theme.emoji} ${theme.name}`:'+ Assign Theme'}</div>
      ${theme?`<div style="font-size:11px;color:var(--slate-400);margin-left:auto;">${theme.category}</div>`:''}`;
    container.appendChild(row);
  });
  if(!weeks.length) container.innerHTML='<div style="color:var(--slate-500);font-size:12px;padding:10px;">No weeks found.</div>';
}

let libraryFilter='All', selectedThemeIds=new Set();

function renderLibrary(){
  const room=getClassroom(currentClassroomId);
  const nm=nextMonthYear(viewYear,viewMonth);
  const nmName=new Date(nm.y,nm.m,1).toLocaleDateString('en-US',{month:'long',year:'numeric'});
  document.getElementById('library-subtitle').textContent=`Selecting for ${room?room.name:''} · ${nmName} · Filter by age group, select 4–5 themes`;

  const cats=['All',...AGE_GROUPS];
  document.getElementById('library-filters').innerHTML=cats.map(c=>`<div class="filter-chip ${c===libraryFilter?'active':''}" onclick="setFilter('${c.replace(/'/g,"\\'")}')">${c}</div>`).join('');

  let filtered;
  if(libraryFilter==='All'){
    const seen=new Set();
    filtered=themeLibrary.filter(t=>{ if(seen.has(t.name)) return false; seen.add(t.name); return true; });
  } else { filtered=themeLibrary.filter(t=>t.category===libraryFilter); }

  document.getElementById('library-grid').innerHTML=filtered.map(t=>{
    const color=CATEGORY_COLORS[t.category]||'#6B8F71';
    const isSel=selectedThemeIds.has(t.id);
    return `<div class="theme-card ${isSel?'selected':''}" onclick="toggleThemeSel(${t.id})">
      <div class="theme-card-accent" style="background:${color}"></div>
      <div style="padding-left:5px;"><div class="theme-emoji">${t.emoji}</div>
      <div class="theme-name">${t.name}</div><div class="theme-desc">${t.desc}</div>
      ${libraryFilter!=='All'?`<div style="font-size:10px;font-weight:600;padding:2px 6px;border-radius:3px;display:inline-block;margin-bottom:6px;background:${color}22;color:${color}">${t.category}</div>`:''}
      <button class="theme-select-btn ${isSel?'selected':''}">${isSel?'✓ Selected':'+ Select'}</button></div></div>`;
  }).join('');

  const count=selectedThemeIds.size;
  const el=document.getElementById('selection-count');
  el.textContent=count>0?`${count} selected ${count<4?'(need at least 4)':count>5?'(max 5 recommended)':'✓ Ready'}`:'';
  el.style.color=count>=4&&count<=5?'var(--sage-dark)':'var(--amber-dark)';
}

function setFilter(c){ libraryFilter=c; renderLibrary(); }
function toggleThemeSel(id){ selectedThemeIds.has(id)?selectedThemeIds.delete(id):selectedThemeIds.add(id); renderLibrary(); }

function confirmThemeSelection(){
  if(!selectedThemeIds.size){ alert('Please select at least 1 theme.'); return; }
  const {y:ny,m:nm}=nextMonthYear(viewYear,viewMonth);
  const key=getMonthKey(ny,nm);
  const cs=getCS(currentClassroomId), td=getTD(currentClassroomId);
  const weeks=getWeeksInMonth(ny,nm);
  const ids=Array.from(selectedThemeIds);
  const schedule={};
  weeks.forEach((_,wi)=>{ schedule[wi]=ids[wi%ids.length]; });
  cs[key]=schedule;
  td[key]=weeks.map((w,wi)=>{ const themeId=schedule[wi]; const theme=themeId?getTheme(themeId):null;
    return { week:w.label, themeId, activities:theme?buildTrackerState(theme.name):[], status:'pending' }; });
  selectedThemeIds.clear();
  const nmName=new Date(ny,nm,1).toLocaleDateString('en-US',{month:'long',year:'numeric'});
  alert(`✓ Themes assigned to ${nmName} for ${getClassroom(currentClassroomId)?.name}!`);
  showPage('calendar',document.getElementById('nav-calendar'));
}

let selectedThemesForModal={};

function openThemeScheduleModal(y,m){
  const {y:ny,m:nm}=nextMonthYear(y,m);
  const cs=getCS(currentClassroomId);
  const schedule=cs[getMonthKey(ny,nm)]||{};
  const weeks=getWeeksInMonth(ny,nm);
  const room=getClassroom(currentClassroomId);
  const nmName=new Date(ny,nm,1).toLocaleDateString('en-US',{month:'long',year:'numeric'});
  document.getElementById('modal-select-subtitle').textContent=`${room?room.emoji+' '+room.name:''} · ${nmName}`;
  selectedThemesForModal={...schedule};
  document.getElementById('week-assign-rows').innerHTML=weeks.map((w,wi)=>{
    const curId=selectedThemesForModal[wi];
    return `<div style="margin-bottom:12px;"><div class="form-label">${w.label}</div>
      <select class="form-input" onchange="selectedThemesForModal[${wi}]=parseInt(this.value)||null">
        <option value="">— No theme —</option>
        ${themeLibrary.filter((t,i,a)=>a.findIndex(x=>x.name===t.name)===i).map(t=>`<option value="${t.id}" ${curId===t.id?'selected':''}>${t.emoji} ${t.name}</option>`).join('')}
      </select></div>`;
  }).join('');
  document.getElementById('modal-select').classList.add('open');
}

function saveThemeAssignments(){
  const {y:ny,m:nm}=nextMonthYear(viewYear,viewMonth);
  const key=getMonthKey(ny,nm);
  const cs=getCS(currentClassroomId), td=getTD(currentClassroomId);
  cs[key]={...selectedThemesForModal};
  const weeks=getWeeksInMonth(ny,nm);
  const existing=td[key]||[];
  td[key]=weeks.map((w,wi)=>{
    const themeId=selectedThemesForModal[wi]||null;
    const theme=themeId?getTheme(themeId):null;
    const ex=existing[wi];
    return { week:w.label, themeId,
      activities:(ex&&ex.themeId===themeId&&ex.activities)?ex.activities:(theme?buildTrackerState(theme.name):[]),
      status:ex?.status||'pending' };
  });
  closeModal('modal-select'); renderCalendar();
}

function renderTracker(){
  const room=getClassroom(currentClassroomId);
  const {y:ny,m:nm}=nextMonthYear(viewYear,viewMonth);
  const key=getMonthKey(ny,nm);
  const nmName=new Date(ny,nm,1).toLocaleDateString('en-US',{month:'long',year:'numeric'});
  const td=getTD(currentClassroomId);
  const rows=td[key]||[];

  document.getElementById('tracker-classroom-name').textContent=room?`${room.emoji} ${room.name} — ${nmName}`:'';

  const trkMon=getTrackerMonday(viewYear,viewMonth), today=new Date();
  const alertEl=document.getElementById('tracker-alert');
  if(trkMon){
    const d=Math.round((trkMon-today)/86400000);
    alertEl.innerHTML=d>=0&&d<=3
      ?`<div class="alert alert-amber"><span class="alert-icon">⏰</span><div class="alert-text"><div class="alert-title">Tracker due ${d===0?'today':`in ${d} day(s)`} — ${formatDate(trkMon)}</div>Confirm supplies for <strong>${nmName}</strong>. Procurement shops tomorrow.</div></div>`
      :`<div class="alert alert-sage"><span class="alert-icon">📋</span><div class="alert-text"><div class="alert-title">Showing themes for ${nmName} · Due ${formatDate(trkMon)}</div>Check activities and confirm supply quantities by the 3rd Monday.</div></div>`;
  } else alertEl.innerHTML='';

  const pending=rows.filter(r=>r.status==='pending').length;
  const badge=document.getElementById('tracker-badge');
  badge.textContent=pending; badge.style.display=pending>0?'':'none';

  const container=document.getElementById('tracker-rows');
  if(!rows.length){
    container.innerHTML=`<div style="text-align:center;padding:40px;color:var(--slate-500);">
      <div style="font-size:32px;margin-bottom:10px;">📋</div>
      <div style="font-weight:700;margin-bottom:4px;">No themes assigned for ${nmName} yet</div>
      <div style="font-size:12px;">Select themes on the 2nd Monday, then come back here to confirm supplies.</div>
      <button class="btn btn-primary" style="margin-top:14px;" onclick="showPage('calendar',document.getElementById('nav-calendar'))">Go to Calendar</button>
    </div>`; return;
  }
  container.innerHTML=rows.map((row,ri)=>buildWeekCard(row,ri,key)).join('');
}

function buildWeekCard(row,ri,key){
  const theme=row.themeId?getTheme(row.themeId):null;
  const acts=row.activities||[];
  const pCls=row.status==='ready'?'pill-ready':row.status==='ordered'?'pill-ordered':'pill-pending';
  const pLbl=row.status==='ready'?'✓ Ready':row.status==='ordered'?'📦 Ordered':'⏳ Pending';
  let tc=0,ts=0;
  acts.forEach(a=>{ ts+=a.supplies.length+a.custom.length; tc+=a.supplies.filter(s=>s.checked).length+a.custom.filter(s=>s.checked).length; });
  const actsHTML=acts.length===0
    ?`<div style="font-size:12px;color:var(--slate-400);padding:10px 0;">No activities loaded. Add custom items below.</div>`
    :acts.map((act,ai)=>`<div class="activity-block">
        <div class="activity-label">📌 ${act.activity}</div>
        ${act.supplies.map((s,si)=>`<div class="supply-item">
          <input type="checkbox" class="supply-checkbox" ${s.checked?'checked':''} onchange="toggleSupply('${key}',${ri},${ai},${si},this.checked)">
          <div class="supply-name ${s.checked?'':'unchecked'}" id="sn-${key}-${ri}-${ai}-${si}">${s.name}</div>
          <input type="text" class="supply-qty-input" value="${s.qty}" placeholder="qty" onblur="updateSupplyQty('${key}',${ri},${ai},${si},this.value)" ${!s.checked?'disabled style="opacity:.4"':''}>
          <div class="supply-unit">${s.unit}</div>
        </div>`).join('')}
        ${act.custom.map((s,ci)=>`<div class="custom-item-row">
          <input type="checkbox" class="supply-checkbox" ${s.checked?'checked':''} onchange="toggleCustom('${key}',${ri},${ai},${ci},this.checked)">
          <input type="text" class="supply-qty-input" value="${s.name}" placeholder="Item name" style="text-align:left;width:100%;" onblur="updateCustomName('${key}',${ri},${ai},${ci},this.value)">
          <input type="text" class="supply-qty-input" value="${s.qty}" placeholder="qty" onblur="updateCustomQty('${key}',${ri},${ai},${ci},this.value)">
          <input type="text" class="supply-qty-input" value="${s.unit}" placeholder="unit" onblur="updateCustomUnit('${key}',${ri},${ai},${ci},this.value)">
          <button class="remove-item-btn" onclick="removeCustom('${key}',${ri},${ai},${ci})">✕</button>
        </div>`).join('')}
        <button class="add-custom-btn" onclick="addCustomItem('${key}',${ri},${ai})">+ Add item</button>
      </div>`).join('');
  return `<div class="week-tracker-card ${row.status}" id="wtc-${ri}">
    <div class="week-tracker-header" onclick="toggleWeekCard(${ri})">
      <div><div class="week-tracker-title">${row.week}</div>
        <div class="week-tracker-theme">${theme?`${theme.emoji} ${theme.name}`:'<span style="color:var(--slate-400)">No theme</span>'}</div></div>
      <div class="week-tracker-meta">
        <span style="font-size:11px;color:var(--slate-500);">${tc}/${ts} items</span>
        <span class="tracker-status-pill ${pCls}">${pLbl}</span>
        <span class="tracker-chevron" id="chev-${ri}">▾</span>
      </div>
    </div>
    <div class="week-tracker-body" id="wtb-${ri}">
      ${actsHTML}
      <div class="tracker-footer">
        <span class="checked-count">${tc} of ${ts} supplies selected</span>
        <div style="display:flex;gap:7px;">
          <select class="form-input" style="width:auto;font-size:12px;padding:5px 9px;" onchange="updateWeekStatus('${key}',${ri},this.value)">
            <option value="pending" ${row.status==='pending'?'selected':''}>⏳ Pending</option>
            <option value="ready"   ${row.status==='ready'  ?'selected':''}>✓ Ready</option>
            <option value="ordered" ${row.status==='ordered'?'selected':''}>📦 Ordered</option>
          </select>
          <button class="btn btn-primary btn-sm" onclick="markWeekReady('${key}',${ri})">Mark Ready</button>
        </div>
      </div>
    </div>
  </div>`;
}

function getTrackerData(key){ return getTD(currentClassroomId)[key]; }
function toggleWeekCard(ri){ document.getElementById(`wtb-${ri}`)?.classList.toggle('open'); document.getElementById(`chev-${ri}`)?.classList.toggle('open'); }
function toggleSupply(key,ri,ai,si,v){ const d=getTrackerData(key); if(!d) return; d[ri].activities[ai].supplies[si].checked=v; const n=document.getElementById(`sn-${key}-${ri}-${ai}-${si}`); if(n) n.className=`supply-name ${v?'':'unchecked'}`; refreshWeekCard(key,ri); }
function updateSupplyQty(key,ri,ai,si,v){ const d=getTrackerData(key); if(d) d[ri].activities[ai].supplies[si].qty=v; }
function addCustomItem(key,ri,ai){ const d=getTrackerData(key); if(!d) return; d[ri].activities[ai].custom.push({name:'',qty:1,unit:'',checked:true}); refreshWeekCard(key,ri); }
function updateCustomName(key,ri,ai,ci,v){ const d=getTrackerData(key); if(d) d[ri].activities[ai].custom[ci].name=v; }
function updateCustomQty(key,ri,ai,ci,v){ const d=getTrackerData(key); if(d) d[ri].activities[ai].custom[ci].qty=v; }
function updateCustomUnit(key,ri,ai,ci,v){ const d=getTrackerData(key); if(d) d[ri].activities[ai].custom[ci].unit=v; }
function toggleCustom(key,ri,ai,ci,v){ const d=getTrackerData(key); if(!d) return; d[ri].activities[ai].custom[ci].checked=v; refreshWeekCard(key,ri); }
function removeCustom(key,ri,ai,ci){ const d=getTrackerData(key); if(!d) return; d[ri].activities[ai].custom.splice(ci,1); refreshWeekCard(key,ri); }
function updateWeekStatus(key,ri,v){ const d=getTrackerData(key); if(d){ d[ri].status=v; refreshWeekCard(key,ri); refreshBadge(key); } }
function markWeekReady(key,ri){ const d=getTrackerData(key); if(d){ d[ri].status='ready'; refreshWeekCard(key,ri); refreshBadge(key); } }
function refreshBadge(key){ const rows=getTrackerData(key)||[]; const p=rows.filter(r=>r.status==='pending').length; const b=document.getElementById('tracker-badge'); b.textContent=p; b.style.display=p>0?'':'none'; }
function refreshWeekCard(key,ri){
  const card=document.getElementById(`wtc-${ri}`); if(!card) return;
  const wasOpen=document.getElementById(`wtb-${ri}`)?.classList.contains('open');
  const row=(getTrackerData(key)||[])[ri]; if(!row) return;
  card.outerHTML=buildWeekCard(row,ri,key);
  if(wasOpen){ document.getElementById(`wtb-${ri}`)?.classList.add('open'); document.getElementById(`chev-${ri}`)?.classList.add('open'); }
}

function exportTracker(){
  const {y:ny,m:nm}=nextMonthYear(viewYear,viewMonth);
  const key=getMonthKey(ny,nm);
  const rows=getTD(currentClassroomId)[key]||[];
  const room=getClassroom(currentClassroomId);
  const site=room?getSite(room.siteId):null;
  const procTue=getProcurementTuesday(viewYear,viewMonth);
  const nmName=new Date(ny,nm,1).toLocaleDateString('en-US',{month:'long',year:'numeric'});
  let text=`PROCUREMENT LIST\nSite: ${site?.name||''} · Classroom: ${room?.name||''}\nMonth: ${nmName}\nShopping Day: ${procTue?formatDate(procTue):'TBD'}\nExported: ${new Date().toLocaleDateString()}\n${'─'.repeat(50)}\n\n`;
  rows.forEach(r=>{
    const theme=r.themeId?getTheme(r.themeId):null;
    text+=`${r.week}  |  ${theme?theme.name:'No theme'}  |  ${r.status.toUpperCase()}\n`;
    (r.activities||[]).forEach(act=>{
      const items=[...act.supplies.filter(s=>s.checked),...act.custom.filter(s=>s.checked&&s.name)];
      if(!items.length) return;
      text+=`  ${act.activity}\n`;
      items.forEach(s=>{ text+=`    - ${s.name} : ${s.qty} ${s.unit}\n`; });
    });
    text+='\n';
  });
  const a=document.createElement('a');
  a.href=URL.createObjectURL(new Blob([text],{type:'text/plain'}));
  a.download=`procurement-${room?.name||'classroom'}-${ny}-${String(nm+1).padStart(2,'0')}.txt`;
  a.click();
}

// PROCUREMENT VIEW
let procSiteFilter='all';

function renderProcurement(){
  const {y:ny,m:nm}=nextMonthYear(viewYear,viewMonth);
  const key=getMonthKey(ny,nm);
  const nmName=new Date(ny,nm,1).toLocaleDateString('en-US',{month:'long',year:'numeric'});
  const procTue=getProcurementTuesday(viewYear,viewMonth);
  document.getElementById('site-tabs').innerHTML=`
    <div class="site-tab ${procSiteFilter==='all'?'active':''}" onclick="setProcFilter('all')">All Sites</div>
    ${SITES.map(s=>`<div class="site-tab ${procSiteFilter===s.id?'active':''}" onclick="setProcFilter('${s.id}')">
      <span style="display:inline-block;width:8px;height:8px;border-radius:50%;background:${s.color};margin-right:4px;"></span>${s.name}
    </div>`).join('')}`;
  const filteredRooms=classrooms.filter(c=>procSiteFilter==='all'||c.siteId===procSiteFilter);
  let totalItems=0,totalPending=0;
  filteredRooms.forEach(room=>{
    const rows=getTD(room.id)[key]||[];
    rows.forEach(r=>{ if(r.status==='pending') totalPending++;
      (r.activities||[]).forEach(act=>{ totalItems+=act.supplies.filter(s=>s.checked).length+act.custom.filter(s=>s.checked&&s.name).length; });
    });
  });
  document.getElementById('proc-stats').innerHTML=`
    <div class="stat-card"><div class="stat-label">Classrooms</div><div class="stat-value">${filteredRooms.length}</div><div class="stat-sub">In view</div></div>
    <div class="stat-card"><div class="stat-label">Total Items</div><div class="stat-value sage">${totalItems}</div><div class="stat-sub">Across all rooms</div></div>
    <div class="stat-card"><div class="stat-label">Pending</div><div class="stat-value amber">${totalPending}</div><div class="stat-sub">Awaiting sign-off</div></div>
    <div class="stat-card"><div class="stat-label">Shopping Day</div><div class="stat-value violet" style="font-size:14px;">${procTue?formatDate(procTue):'TBD'}</div><div class="stat-sub">Procurement Tuesday</div></div>`;
  const content=document.getElementById('procurement-content');
  if(!filteredRooms.length){ content.innerHTML='<div style="padding:40px;text-align:center;color:var(--slate-500);">No classrooms found.</div>'; return; }
  let html=`<div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:14px;">
    <div class="section-title" style="margin:0;">Shopping Lists for ${nmName}</div>
    ${procTue?`<div style="font-size:12.5px;color:var(--violet-dark);font-weight:600;">Buy by: ${formatDate(procTue)}</div>`:''}
  </div>`;
  const sites=procSiteFilter==='all'?SITES:SITES.filter(s=>s.id===procSiteFilter);
  sites.forEach(site=>{
    const siteRooms=filteredRooms.filter(c=>c.siteId===site.id);
    if(!siteRooms.length) return;
    html+=`<div style="display:flex;align-items:center;gap:8px;margin:16px 0 8px;">
      <div style="width:4px;height:16px;border-radius:2px;background:${site.color}"></div>
      <div style="font-size:13px;font-weight:700;color:var(--slate-700);">${site.name}</div>
    </div>`;
    siteRooms.forEach(room=>{
      const rows=getTD(room.id)[key]||[];
      html+=`<div class="procurement-card" style="border-top:3px solid ${site.color};">
        <div class="procurement-card-header" style="background:${site.color}18;">
          <div><div class="procurement-card-title" style="color:${site.color};">${room.emoji} ${room.name}</div>
          <div style="font-size:11px;color:var(--slate-500);margin-top:1px;">${site.name}</div></div>
          ${rows.length===0?'<span class="status-badge badge-pending">No themes yet</span>':
            `<span style="font-size:11px;color:var(--slate-500);">${rows.length} week(s)</span>`}
        </div>`;
      if(!rows.length){
        html+=`<div style="padding:12px 16px;font-size:12px;color:var(--slate-400);">No themes assigned for this classroom yet.</div>`;
      } else {
        rows.forEach(r=>{
          const theme=r.themeId?getTheme(r.themeId):null;
          const allSupplies=[];
          (r.activities||[]).forEach(act=>{ [...act.supplies.filter(s=>s.checked),...act.custom.filter(s=>s.checked&&s.name)].forEach(s=>allSupplies.push({activity:act.activity,name:s.name,qty:s.qty,unit:s.unit})); });
          const bCls=r.status==='ready'?'badge-ready':r.status==='ordered'?'badge-ordered':'badge-pending';
          const bLbl=r.status==='ready'?'Ready':r.status==='ordered'?'Ordered':'Pending';
          html+=`<div style="border-top:1px solid var(--slate-100);padding:10px 16px;">
            <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:5px;">
              <div style="font-size:12px;font-weight:600;">${r.week}${theme?' · '+theme.emoji+' '+theme.name:''}</div>
              <span class="status-badge ${bCls}">${bLbl}</span>
            </div>`;
          if(!allSupplies.length){ html+=`<div style="font-size:11.5px;color:var(--slate-400);">No supplies checked yet.</div>`; }
          else { html+=`<table class="procurement-table"><thead><tr><th>Activity</th><th>Supply</th><th>Qty</th><th>Unit</th></tr></thead><tbody>
            ${allSupplies.map(s=>`<tr><td style="color:var(--slate-500);font-size:11px;">${s.activity}</td><td style="font-weight:500;">${s.name}</td><td style="text-align:center;font-weight:600;">${s.qty}</td><td style="color:var(--slate-500);">${s.unit}</td></tr>`).join('')}
            </tbody></table>`; }
          html+='</div>';
        });
      }
      html+='</div>';
    });
  });
  content.innerHTML=html;
}

function setProcFilter(f){ procSiteFilter=f; renderProcurement(); }

// ═══════════════════════════════════════
//  GOOGLE APPS SCRIPT API LAYER
// ═══════════════════════════════════════

const LS_URL_KEY = 'curriculumflow_script_url';
let scriptUrl = localStorage.getItem(LS_URL_KEY) || '';
let saveTimer = null;
let isConnected = false;

// ── Sync pill UI ──
function setSyncState(state, label) {
  const pill = document.getElementById('sync-pill');
  const lbl  = document.getElementById('sync-label');
  pill.className = 'sync-pill ' + state;
  lbl.textContent = label;
}

// ── Low-level fetch wrapper ──
async function apiGet(params) {
  if (!scriptUrl) return null;
  const url = scriptUrl + '?' + new URLSearchParams(params).toString();
  const res = await fetch(url);
  return res.json();
}

async function apiPost(body) {
  if (!scriptUrl) return null;
  const res = await fetch(scriptUrl, {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify(body),
  });
  return res.json();
}

// ── Test connection ──
async function testConnection() {
  if (!scriptUrl) { setSyncState('idle','Not connected'); isConnected=false; return false; }
  setSyncState('loading','Connecting…');
  try {
    const r = await apiGet({ action:'ping' });
    if (r && r.ok) { setSyncState('saved','Connected ✓'); isConnected=true; return true; }
    setSyncState('error','Connection failed'); isConnected=false; return false;
  } catch(e) {
    setSyncState('error','Connection failed'); isConnected=false; return false;
  }
}

// ── Load schedule for current classroom + month ──
async function loadSchedule(classroomId, monthKey) {
  if (!isConnected) return null;
  try {
    const r = await apiGet({ action:'getSchedule', classroomId, monthKey });
    return (r && r.found) ? r.data : null;
  } catch(e) { return null; }
}

// ── Load tracker for current classroom + next month ──
async function loadTracker(classroomId, monthKey) {
  if (!isConnected) return null;
  try {
    const r = await apiGet({ action:'getTracker', classroomId, monthKey });
    return (r && r.found) ? r.data : null;
  } catch(e) { return null; }
}

// ── Load ALL classrooms' tracker data for procurement ──
async function loadAllTracker(monthKey) {
  if (!isConnected) return null;
  try {
    const r = await apiGet({ action:'getAllTracker', monthKey });
    return (r && r.found) ? r.classrooms : null;
  } catch(e) { return null; }
}

// ── Auto-save: debounced 1.5s after any change ──
function scheduleSave(classroomId, monthKey) {
  if (!isConnected) return;
  clearTimeout(saveTimer);
  setSyncState('saving','Saving…');
  saveTimer = setTimeout(() => persistData(classroomId, monthKey), 1500);
}

async function persistData(classroomId, monthKey) {
  if (!isConnected) return;
  const cs = getCS(classroomId);
  const td = getTD(classroomId);
  const {y:ny, m:nm} = nextMonthYear(viewYear, viewMonth);
  const nextKey = getMonthKey(ny, nm);
  try {
    const jobs = [];
    if (cs[monthKey]) jobs.push(apiPost({ action:'saveSchedule', classroomId, monthKey, schedule: cs[monthKey] }));
    if (td[nextKey])  jobs.push(apiPost({ action:'saveTracker',  classroomId, monthKey: nextKey, rows: td[nextKey] }));
    await Promise.all(jobs);
    setSyncState('saved', 'Saved ✓ ' + new Date().toLocaleTimeString([], {hour:'2-digit',minute:'2-digit'}));
  } catch(e) {
    setSyncState('error', 'Save failed — check connection');
  }
}

// ── Load data when switching classroom or month ──
async function loadClassroomData(classroomId) {
  if (!isConnected) return;
  const monthKey = getMonthKey(viewYear, viewMonth);
  const {y:ny, m:nm} = nextMonthYear(viewYear, viewMonth);
  const nextKey  = getMonthKey(ny, nm);
  setSyncState('loading','Loading…');
  try {
    const [sched, tracker] = await Promise.all([
      loadSchedule(classroomId, monthKey),
      loadTracker(classroomId, nextKey),
    ]);
    if (sched)   getCS(classroomId)[monthKey] = sched;
    if (tracker) getTD(classroomId)[nextKey]  = tracker;
    setSyncState('saved','Loaded ✓');
  } catch(e) {
    setSyncState('error','Load failed');
  }
}

// ── Patch save triggers into existing functions ──
// Called after any user action that mutates state
function triggerSave() {
  const monthKey = getMonthKey(viewYear, viewMonth);
  scheduleSave(currentClassroomId, monthKey);
}

// ── Setup screen ──
function openSetup() {
  document.getElementById('script-url-input').value = scriptUrl;
  document.getElementById('setup-status').textContent = '';
  document.getElementById('setup-screen').style.display = 'flex';
}
function closeSetup() {
  document.getElementById('setup-screen').style.display = 'none';
}
async function saveScriptUrl() {
  const url = document.getElementById('script-url-input').value.trim();
  const statusEl = document.getElementById('setup-status');
  if (!url) { statusEl.textContent = '⚠ Please paste the Web App URL.'; return; }
  scriptUrl = url;
  localStorage.setItem(LS_URL_KEY, url);
  statusEl.textContent = '⏳ Testing connection…';
  const ok = await testConnection();
  if (ok) {
    statusEl.style.color = 'var(--sage-dark)';
    statusEl.textContent = '✓ Connected! Loading data…';
    await loadClassroomData(currentClassroomId);
    setTimeout(() => { closeSetup(); renderCalendar(); }, 800);
  } else {
    statusEl.style.color = 'var(--rose)';
    statusEl.textContent = '✗ Could not connect. Check the URL and make sure the deployment is set to "Anyone can access".';
  }
}

const _origChangeMonth = changeMonth;
window.changeMonth = async function(delta) {
  _origChangeMonth(delta);
  await loadClassroomData(currentClassroomId);
};

// Procurement view: load all classrooms from server
const _origRenderProcurement = renderProcurement;
window.renderProcurement = async function() {
  if (isConnected) {
    const {y:ny, m:nm} = nextMonthYear(viewYear, viewMonth);
    const nextKey = getMonthKey(ny, nm);
    setSyncState('loading','Loading all classrooms…');
    const allData = await loadAllTracker(nextKey);
    if (allData) {
      Object.entries(allData).forEach(([cid, val]) => {
        getTD(cid)[nextKey] = val.data;
      });
      setSyncState('saved','All classrooms loaded ✓');
    }
  }
  _origRenderProcurement();
};

// ═══════════════════════════════════════
//  INIT
// ═══════════════════════════════════════
async function init() {
  renderClassroomList();
  updateTopbarClassroom();
  if (scriptUrl) {
    const ok = await testConnection();
    if (ok) await loadClassroomData(currentClassroomId);
  } else {
    setSyncState('idle','Not connected — click ⚙ Setup');
  }
  renderCalendar();
}

init();
